
name: Day 3 CI

on:
  push:
    branches:
      - day3-service-aanya

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download champion model
        run: |
          mkdir -p models
          curl --fail --location --retry 3 \
            --output models/model.joblib \
            https://github.com/rudra-sahu246/G175_MP023/releases/latest/download/v1.joblib

      - name: Verify champion model checksum
        run: |
          echo "361b63375cb0a1d82f53d747443655d7bda0f177b4e8051f5513552ecb03ebad  models/model.joblib" | sha256sum --check

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-day3.txt
          python -m pip install -e . --no-deps

      - name: Run tests
        run: python -m pytest -q

