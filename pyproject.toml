[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mp023"
version = "0.1.0"
description = "MP023 Cab Pick-up Time Prediction"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "pyyaml"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
